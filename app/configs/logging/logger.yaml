version: 1
disable_existing_loggers: false

formatters:
  console:
    (): app.base.logging.formatters.NoExcConsoleFormatter
    format: "%(asctime)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    '()': app.base.logging.formatters.CustomJsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(filename)s %(lineno)d %(funcName)s %(message)s %(exc_text)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout

  file:
    class: concurrent_log_handler.ConcurrentRotatingFileHandler
    level: DEBUG
    formatter: json
    filename: app.log
    maxBytes: 1048576   # 1 MB
    backupCount: 7
    use_gzip: true       # compress old logs

loggers:
  app:
    level: DEBUG
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console, file]
